<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quán Ăn Chợ Nổi</title>
<style>
  html, body { margin: 0; height: 100%; background: #10161c; overflow: hidden; user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c" aria-label="Quán Ăn Chợ Nổi"></canvas>
<script>
"use strict";
/*
 * Client chơi trực tiếp — đồ họa 2D làng quê Nam Bộ (Canvas 2D, JavaScript thuần, không asset ngoài).
 * CHỈ ĐỌC snapshot từ GET /state, gửi phím đang giữ qua POST /input, chơi lại qua POST /restart.
 * Cảnh, trục điều khiển và HUD chọn theo snapshot.phase (gather | quan | shop); mode chỉ là dự phòng.
 * Mọi hình (nền, Út Sen, cá, Cá Sấu, bếp, bàn, món) vẽ thủ tục MỘT lần vào canvas ẩn rồi tái dùng.
 * Phím: WASD/mũi tên · E tương tác · Space bắt cá · P/Esc tạm dừng · R chơi lại · M âm thanh · C tương phản
 *       Shop: 1/2/3 mua · Enter đóng Shop.   URL: ?fx=0 tắt hiệu ứng · ?hc=1 tương phản cao · ?fps=1 hiện FPS.
 */
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
const FONT = 'system-ui, "Segoe UI", "Noto Sans", Roboto, "Helvetica Neue", Arial, sans-serif';
const qs = new URLSearchParams(location.search);
const noFx = qs.get("fx") === "0";
const showFps = qs.get("fps") === "1";
function ssGet(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }
function ssSet(k, v) { try { sessionStorage.setItem(k, v); } catch (e) { /* bỏ qua */ } }
let hc = qs.get("hc") === "1" || ssGet("chonoi_high_contrast") === "1";
let soundOn = ssGet("chonoi_sound") !== "0";
const fx = () => !noFx && !hc;
function toggleContrast() { hc = !hc; ssSet("chonoi_high_contrast", hc ? "1" : "0"); clearCaches(); }
function toggleSound() { soundOn = !soundOn; ssSet("chonoi_sound", soundOn ? "1" : "0"); }

// ---------- từ điển hiển thị ----------
const KIND = {
  ca_loc: { name: "Cá lóc", col: "#6b7a3a" }, ca_linh: { name: "Cá linh", col: "#c9d6df" },
  ca_keo: { name: "Cá kèo", col: "#b08a5a" }, bong_dien_dien: { name: "Bông điên điển", col: "#f2c230" },
  bong_sung: { name: "Bông súng", col: "#e57ab0" }, keo_neo: { name: "Kèo nèo", col: "#5fae4e" },
};
const DISH = {
  ca_loc_nuong_trui: "Cá lóc nướng trui", goi_bong_sung: "Gỏi bông súng",
  lau_ca_linh_dien_dien: "Lẩu cá linh điên điển", canh_chua_ca_loc: "Canh chua cá lóc",
  ca_keo_nuong: "Cá kèo nướng", lau_mam: "Lẩu mắm",
};
// Bản sao CHỈ để hiển thị bảng phấn (nguồn: game.contract.json v1.1 › menu). Client tự học lại công thức/giá
// từ snapshot (customers[].reserved) và event (cook_started) — dữ liệu server luôn được ưu tiên.
const MENU_FALLBACK = {
  ca_loc_nuong_trui: { recipe: { ca_loc: 1 }, price: 60 }, goi_bong_sung: { recipe: { bong_sung: 2 }, price: 40 },
  lau_ca_linh_dien_dien: { recipe: { ca_linh: 3, bong_dien_dien: 1 }, price: 120 },
  canh_chua_ca_loc: { recipe: { ca_loc: 1, bong_dien_dien: 1 }, price: 90 },
  ca_keo_nuong: { recipe: { ca_keo: 2 }, price: 70 },
  lau_mam: { recipe: { ca_linh: 2, ca_keo: 1, keo_neo: 1, bong_dien_dien: 1 }, price: 200 },
};
const learned = { recipe: {}, price: {} };
const UPG = { oxygen: "Bình dưỡng khí", hp: "Áo phao bền", net: "Vợt hút cá" };
const UPG_ORDER = ["oxygen", "hp", "net"];
const FAIL_REASON = { funds: "Không đủ tiền", max_level: "Đã đạt cấp tối đa", unknown: "Món hàng không có" };

// ---------- tiện ích ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const num = (v, d = 0) => (typeof v === "number" && isFinite(v) ? v : d);
const arr = (v) => (Array.isArray(v) ? v : []);
const obj = (v) => (v && typeof v === "object" && !Array.isArray(v) ? v : {});
const pos2 = (p) => (Array.isArray(p) && p.length >= 2 && isFinite(p[0]) && isFinite(p[1]) ? [+p[0], +p[1]] : null);
const kindName = (k) => (KIND[k] ? KIND[k].name : String(k ?? "?"));
const dishName = (d) => DISH[d] || String(d ?? "?");
const secs = (t) => Math.max(0, Math.ceil(num(t) / 60));
function fmtTime(t) { if (typeof t !== "number") return "--:--"; const s = secs(t); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
function idKey(id) { const m = /^(.*?)(\d+)$/.exec(String(id)); return m ? [m[1], parseInt(m[2], 10)] : [String(id), -1]; }
function cmpId(a, b) { const x = idKey(a), y = idKey(b); return x[0] < y[0] ? -1 : x[0] > y[0] ? 1 : x[1] - y[1]; }
function hash(s) { let h = 2166136261; for (const ch of String(s)) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function rand(seed) { let s = seed >>> 0 || 1; return () => { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; }; } // chỉ để trang trí
function recipeOf(d) { return learned.recipe[d] || (MENU_FALLBACK[d] && MENU_FALLBACK[d].recipe) || null; }
function priceOf(d) { return learned.price[d] ?? (MENU_FALLBACK[d] && MENU_FALLBACK[d].price); }
function countKinds(list) {
  const out = {}; let spoiled = 0;
  for (const it of arr(list)) {
    const isObj = it && typeof it === "object";
    const k = isObj ? it.kind : it;
    if (isObj && typeof it.fresh === "number" && it.fresh < 30) { spoiled++; continue; }
    if (k) out[k] = (out[k] || 0) + 1;
  }
  return { counts: out, spoiled };
}
function sceneOf(s) {
  if (!s) return "gather";
  const ph = s.phase;
  if (ph === "gather" || ph === "quan" || ph === "shop") return ph;
  return s.mode === "quan" ? "quan" : "gather";
}

// ---------- âm thanh tự sinh (Web Audio, 0 KB) ----------
let audioCtx = null;
function initAudio() {
  try {
    if (!audioCtx) { const A = window.AudioContext || window.webkitAudioContext; if (A) audioCtx = new A(); }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  } catch (e) { /* trình duyệt chặn âm thanh */ }
}
function tone(freq, dur, type = "sine", gain = 0.12, slideTo = 0, delay = 0) {
  if (!soundOn || !audioCtx) return;
  try {
    const t0 = audioCtx.currentTime + delay;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(gain, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(audioCtx.destination); o.start(t0); o.stop(t0 + dur + 0.02);
  } catch (e) { /* bỏ qua */ }
}
const SFX = {
  harvest() { tone(523, 0.1, "triangle"); tone(659, 0.12, "triangle", 0.12, 0, 0.05); tone(784, 0.18, "sine", 0.14, 0, 0.1); },
  catch() { tone(220, 0.22, "sine", 0.16, 880); },
  splash() { tone(340, 0.22, "triangle", 0.14, 80); },
  bell() { tone(880, 0.35, "sine", 0.15); tone(1760, 0.45, "sine", 0.1, 0, 0.07); },
  coin() { tone(988, 0.08, "sine", 0.14); tone(1319, 0.3, "sine", 0.15, 0, 0.06); },
  alert() { tone(330, 0.12, "square", 0.07); tone(294, 0.18, "square", 0.07, 0, 0.1); },
  hit() { tone(140, 0.35, "sawtooth", 0.22, 35); },
  pop() { tone(660, 0.08, "triangle", 0.1); },
  fail() { tone(200, 0.22, "square", 0.08, 120); },
};

// ---------- mạng: /state, /input, /restart ----------
let snap = null, offline = false, curScene = null, firstSnap = true;
const held = new Set();
const MOVE = { w: "u", arrowup: "u", s: "d", arrowdown: "d", a: "l", arrowleft: "l", d: "r", arrowright: "r" };
let lastSent = "", sendQ = [], sending = false;
const isFinished = () => !!(snap && snap.finished);

function inputState() {
  const sc = curScene || sceneOf(snap);
  let dx = (held.has("r") ? 1 : 0) - (held.has("l") ? 1 : 0);
  let dy = (held.has("d") ? 1 : 0) - (held.has("u") ? 1 : 0);
  if (sc === "quan") dy = -dy;                 // Quán: trục z hướng LÊN màn hình; Gather: d hướng xuống
  if (sc === "shop" || isFinished()) { dx = 0; dy = 0; }
  return { move: [dx, dy], interact: sc !== "shop" && held.has("interact"), catch: sc === "gather" && held.has("catch"),
           pause: held.has("pause"), shop_done: sc === "shop" && held.has("shop_done") };
}
function pushInput(force) { const s = JSON.stringify(inputState()); if (!force && s === lastSent) return; lastSent = s; send(s); }
function send(body) { sendQ.push(body); flush(); }
async function flush() {
  if (sending) return;
  sending = true;
  while (sendQ.length) {
    const body = sendQ.shift();
    try { await fetch("/input", { method: "POST", body, headers: { "Content-Type": "application/json" } }); } catch (e) { offline = true; }
  }
  sending = false;
}
function pulse(name) { held.add(name); pushInput(); setTimeout(() => { held.delete(name); pushInput(); }, 90); }
function buy(id) { initAudio(); send(JSON.stringify({ buy: id })); }
function restartGame() {
  held.clear(); lastSent = "";
  fetch("/restart", { method: "POST" }).catch(() => { offline = true; });
  resetClient();
}

async function poll() {
  try {
    const r = await fetch("/state", { cache: "no-store" });
    const s = await r.json();
    if (s && typeof s === "object") onSnapshot(s);
    offline = false;
  } catch (e) { offline = true; }
  setTimeout(poll, 16);
}

// ---------- trạng thái phía client (chỉ hiển thị) ----------
const ST = {};
function newDayStats() { return { served: 0, left: 0, tips: 0, shiftEarned: null, repStart: null, repEnd: null, arrived: 0 }; }
function resetClient() {
  Object.assign(ST, {
    day: newDayStats(), tot: { served: 0, left: 0, tips: 0, dishes: {}, daysDone: 0 }, faintCause: null,
    evTick: -1, evCount: 0, introHidden: {}, shopMsg: null, gatherMeta: null,
    croc: {}, cookMax: {}, qLast: null, qFace: -Math.PI / 2, camX: null, sceneT0: performance.now(),
  });
  parts.length = 0; floats.length = 0; toasts.length = 0; firstSnap = true; curScene = null;
}
const parts = [], floats = [], toasts = [];
let shake = 0, flash = 0;

function onSnapshot(s) {
  if (snap && num(s.tick) < num(snap.tick)) resetClient();   // server đã chơi lại
  snap = s;
  const sc = sceneOf(s);
  if (sc !== curScene) {
    const prev = curScene;
    curScene = sc;
    ST.sceneT0 = performance.now();
    ST.camX = null;
    for (let i = parts.length - 1; i >= 0; i--) if (parts[i].scene !== sc) parts.splice(i, 1);
    if (sc === "quan" && ST.day.repStart === null) ST.day.repStart = num(s.reputation, null);
    if (prev !== null) pushInput(true);       // trục đổi theo cảnh → gửi lại trạng thái phím ngay
  }
  if (sc === "gather" && s.meta && obj(s.meta.bounds).d) ST.gatherMeta = s.meta;
  for (const c of arr(s.customers)) if (c && c.dish_id && c.reserved && Object.keys(obj(c.reserved)).length) learned.recipe[c.dish_id] = obj(c.reserved);
  processEvents(s);
  for (const st of arr(s.stoves)) {
    if (!st || !st.id) continue;
    if (st.state === "cooking") ST.cookMax[st.id] = Math.max(ST.cookMax[st.id] || 0, num(st.cook_ticks_left));
    else if (st.state === "idle") ST.cookMax[st.id] = 0;
  }
  firstSnap = false;
}

function processEvents(s) {
  const evs = arr(s.events);
  const seen = {};
  let maxT = ST.evTick;
  for (const ev of evs) {
    if (!ev || typeof ev !== "object") continue;
    const t = num(ev.tick, -1);
    seen[t] = (seen[t] || 0) + 1;
    if (t > maxT) maxT = t;
    if (t < ST.evTick || (t === ST.evTick && seen[t] - 1 < ST.evCount)) continue;
    if (!firstSnap) { try { handleEvent(ev, s); } catch (e) { console.warn("event", ev.name, e); } }
  }
  if (maxT > ST.evTick) { ST.evTick = maxT; ST.evCount = seen[maxT] || 0; }
  else if (maxT === ST.evTick) ST.evCount = Math.max(ST.evCount, seen[maxT] || 0);
}

function playerPos(s) { return pos2(obj(s && s.player).pos); }
function tablePos(s, id) { const tb = arr(s.tables).find((t) => t && t.id === id); return tb ? pos2(tb.pos) : null; }
function stovePos(s, id) { const st = arr(s.stoves).find((t) => t && t.id === id); return st ? pos2(st.pos) : null; }

function handleEvent(ev, s) {
  const d = obj(ev.data), sc = ev.phase || sceneOf(s), pp = playerPos(s);
  switch (ev.name) {
    case "gather": {
      SFX.harvest();
      const n = arr(s.nodes).find((x) => x && x.id === d.node_id), np = n ? pos2(n.pos) : pp;
      if (np) { addFloat("gather", np[0], np[1] - 1.5, `+${num(d.amount, 1)} ${kindName(d.kind)}`, "#b8f27c"); burst("gather", np[0], np[1] - 0.6, "leaf", 10); }
      break;
    }
    case "fish_caught": SFX.catch(); if (pp) { addFloat("gather", pp[0], pp[1] - 1.4, `+${num(d.yield, 1)} ${kindName(d.kind)}`, "#9fe8ff"); burst("gather", pp[0], pp[1], "spark", 12); } break;
    case "hold_full": SFX.fail(); addToast(`Giỏ đầy: cần ${num(d.required)} chỗ, còn ${num(d.free)} — về bến cập kho`, "warn"); break;
    case "dive": case "surface": SFX.splash(); { const p = pos2(d.pos) || pp; if (p) burst("gather", p[0], 0, "splash", 14); } break;
    case "oxygen_empty": SFX.alert(); addToast("HẾT OXY! Mỗi giây dưới nước mất 1 Máu — nổi lên ngay", "warn"); shakeIt(10); break;
    case "choke": SFX.alert(); if (pp) addFloat("gather", pp[0], pp[1] - 1.4, "−1 Máu (ngạt)", "#ff8a80"); flash = 0.35; break;
    case "monster_hit": {
      SFX.hit(); shakeIt(18); flash = 0.5;
      const lost = arr(d.lost).length;
      addToast(`Cá Sấu Năm Chèo cắn! −1 Máu${lost ? `, rơi ${lost} món khỏi giỏ` : ""}`, "warn");
      if (pp) addFloat("gather", pp[0], pp[1] - 1.4, "−1 Máu", "#ff6b6b");
      break;
    }
    case "faint":
      SFX.alert(); ST.faintCause = d.cause || null; shakeIt(24);
      addToast(d.cause === "monster" ? "Út Sen bị Cá Sấu cắn ngất — giỏ trôi mất!" : "Út Sen ngạt nước ngất đi — giỏ trôi mất!", "warn", 5);
      break;
    case "gather_end":
      if (d.reason === "docked") { SFX.bell(); const n = Object.values(obj(obj(d.inventory).items)).reduce((a, b) => a + num(b), 0); addToast(`Cập bến! Mang về ${n} món cho quán Má Tư`, "good"); }
      else if (d.reason === "time") addToast("Hết giờ ca sáng — quay về quán", "info");
      break;
    case "customer_arrived": SFX.pop(); ST.day.arrived++; { const tp = tablePos(s, d.table_id); if (tp) addFloat("quan", tp[0], tp[1] + 1.6, "Khách mới!", "#ffe082"); } break;
    case "no_dish": addToast("Kho không đủ nguyên liệu cho món nào — khách không vào", "info"); break;
    case "cook_started": {
      SFX.pop();
      if (d.dish_id && Array.isArray(d.items)) { const r = {}; for (const k of d.items) r[k] = (r[k] || 0) + 1; learned.recipe[d.dish_id] = r; }
      if (d.dish_id && typeof d.base_price === "number") learned.price[d.dish_id] = d.base_price;
      const sp = stovePos(s, d.stove_id); if (sp) burst("quan", sp[0], sp[1], "spark", 8);
      break;
    }
    case "dish_ready": SFX.bell(); { const sp = stovePos(s, d.stove_id); if (sp) addFloat("quan", sp[0], sp[1] + 1.2, "Chín rồi!", "#a5ff8a"); } break;
    case "dish_picked": SFX.pop(); break;
    case "served": {
      SFX.pop(); ST.day.served++; ST.tot.served++;
      if (d.dish_id) ST.tot.dishes[d.dish_id] = (ST.tot.dishes[d.dish_id] || 0) + 1;
      const tp = tablePos(s, d.table_id); if (tp) addFloat("quan", tp[0], tp[1] + 1.4, num(d.tip) > 0 ? "Khách khen! +boa" : "Đã dọn món", "#c8f7a0");
      break;
    }
    case "paid": {
      SFX.coin(); ST.day.tips += num(d.tip); ST.tot.tips += num(d.tip);
      const tp = tablePos(s, d.table_id); if (tp) { addFloat("quan", tp[0], tp[1] + 1.8, `+${num(d.amount, num(d.base_price))}k`, "#ffd54f"); burst("quan", tp[0], tp[1], "spark", 10); }
      break;
    }
    case "customer_left":
      if (d.reason === "patience") { SFX.alert(); ST.day.left++; ST.tot.left++; addToast(`Khách bàn ${d.table_id || "?"} giận bỏ về — uy tín giảm`, "warn"); }
      break;
    case "quan_end": ST.day.shiftEarned = num(d.shift_earned, null); ST.day.repEnd = num(d.reputation, null); addToast("Đóng quán — sang ghe hàng nâng cấp", "info"); break;
    case "bought": SFX.coin(); ST.shopMsg = { text: `Đã mua ${UPG[d.upgrade] || d.upgrade} cấp ${num(d.level)} (−${num(d.price)}k) — hiệu lực từ Ngày sau`, good: true, t: performance.now() }; break;
    case "buy_failed": SFX.fail(); ST.shopMsg = { text: `Không mua được ${UPG[d.action] || d.action}: ${FAIL_REASON[d.reason] || d.reason}`, good: false, t: performance.now() }; break;
    case "shop_end": ST.tot.daysDone++; break;
    case "day_start": ST.day = newDayStats(); ST.shopMsg = null; break;
    case "paused": case "resumed": SFX.pop(); break;
    case "spoiled": addToast(`${kindName(d.kind)} đã ươn`, "warn"); break;
    case "current_warning": addToast("Sắp có nước xiết!", "warn"); break;
    default: break;
  }
}

// ---------- hiệu ứng (giới hạn số hạt) ----------
const PART_CAP = 140;
function addPart(p) { if (!fx()) return; if (parts.length >= PART_CAP) parts.shift(); parts.push(p); }
function burst(scene, x, y, kind, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = 1 + Math.random() * 2.5;
    addPart({ scene, kind, x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - (kind === "splash" ? 3 : 0.5), life: 0.6 + Math.random() * 0.5, max: 1.1, r: 2 + Math.random() * 3 });
  }
}
function addFloat(scene, x, y, str, col) { floats.push({ scene, x, y, str, col, t0: performance.now() }); if (floats.length > 12) floats.shift(); }
function addToast(str, kind = "info", dur = 3.5) { toasts.push({ str, kind, t0: performance.now(), dur }); if (toasts.length > 4) toasts.shift(); }
function shakeIt(m) { if (fx()) shake = Math.max(shake, m); }

// ---------- vẽ cơ bản ----------
let W = 1280, H = 720, DPR = 1, T = 0, dt = 0.016;
const font = (size, weight = 600) => `${weight} ${size}px ${FONT}`;
function pathRR(c, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function text(str, x, y, o = {}) {
  const s = String(str ?? ""), size = o.size || 18;
  ctx.save();
  ctx.font = font(size, o.weight || 600);
  ctx.textAlign = o.align || "left"; ctx.textBaseline = o.base || "middle";
  const sw = hc ? Math.max(3, size * 0.22) : (o.stroke ? Math.max(2.5, size * 0.17) : 0);
  if (sw) { ctx.lineJoin = "round"; ctx.strokeStyle = hc ? "#000" : (o.strokeColor || "rgba(0,0,0,0.8)"); ctx.lineWidth = sw; ctx.strokeText(s, x, y, o.max); }
  ctx.fillStyle = hc ? (o.hcColor || "#ffffff") : (o.color || "#f6efe2");
  ctx.fillText(s, x, y, o.max);
  ctx.restore();
}
const twCache = new Map();
function tw(str, size, weight = 600) {        // đo chữ có nhớ đệm: HUD đo lại cùng chuỗi mỗi khung
  const k = size + "|" + weight + "|" + str;
  let w = twCache.get(k);

// nút bấm bằng chuột (đăng ký lại mỗi khung)
let hits = [];
function hitArea(x, y, w, h, fn) { hits.push({ x, y, w, h, fn }); }

  ctx.lineWidth = hc ? 3 : 2; ctx.strokeStyle = hc ? "#fff" : (on ? (o.border || "#e8b766") : "rgba(200,200,200,0.4)"); ctx.stroke();
  ctx.restore();

}
cv.addEventListener("click", (e) => {
  initAudio();
  const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  for (let i = hits.length - 1; i >= 0; i--) { const b = hits[i]; if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { b.fn(); return; } }
});
cv.addEventListener("mousemove", (e) => {
  const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  cv.style.cursor = hits.some((b) => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) ? "pointer" : "default";
});

// ---------- bàn phím ----------
function keyName(e) { return e.key.length === 1 ? e.key.toLowerCase() : e.key.toLowerCase(); }
addEventListener("keydown", (e) => {
  initAudio();
  const k = keyName(e);
  if (e.repeat) { if (k === " " || k.startsWith("arrow")) e.preventDefault(); return; }
  hideIntro();
  if (MOVE[k]) { held.add(MOVE[k]); e.preventDefault(); }
  else if (k === "e") held.add("interact");
  else if (k === " ") { held.add("catch"); e.preventDefault(); }
  else if (k === "enter") { if (curScene === "shop") held.add("shop_done"); }
  else if (k === "p" || k === "escape") { held.add("pause"); e.preventDefault(); }
  else if (k === "r") restartGame();
  else if (k === "m") toggleSound();
  else if (k === "c") toggleContrast();
  else if (curScene === "shop" && /^[1-9]$/.test(k)) { const id = shopIds()[+k - 1]; if (id) buy(id); }
  pushInput();
});
addEventListener("keyup", (e) => {
  const k = keyName(e);
  if (MOVE[k]) held.delete(MOVE[k]);
  else if (k === "e") held.delete("interact");
  else if (k === " ") held.delete("catch");
  else if (k === "enter") held.delete("shop_done");
  else if (k === "p" || k === "escape") held.delete("pause");
  pushInput();
});
addEventListener("blur", () => { held.clear(); pushInput(); });

// ---------- bộ nhớ đệm lớp nền và sprite (vẽ một lần, tái dùng) ----------
const layerCache = new Map(), spriteCache = new Map();
function makeCanvas(w, h) { const c = document.createElement("canvas"); c.width = Math.max(1, Math.ceil(w * DPR)); c.height = Math.max(1, Math.ceil(h * DPR)); return c; }
function layer(key, w, h, paint) {
  let L = layerCache.get(key);
  if (!L) {
    const cvs = makeCanvas(w, h), c = cvs.getContext("2d");
    c.scale(DPR, DPR); paint(c, w, h);
    L = { cv: cvs, w, h }; layerCache.set(key, L);
    if (layerCache.size > 16) layerCache.delete(layerCache.keys().next().value);
  }
  return L;
}
function blit(L, x, y) { ctx.drawImage(L.cv, x, y, L.w, L.h); }
function sprite(key, w, h, ax, ay, paint) {
  let S = spriteCache.get(key);
  if (!S) {
    const cvs = makeCanvas(w, h), c = cvs.getContext("2d");
    c.scale(DPR, DPR); c.translate(ax, ay); paint(c);
    S = { cv: cvs, w, h, ax, ay }; spriteCache.set(key, S);
    if (spriteCache.size > 500) spriteCache.clear();
  }
  return S;
}
function drawSprite(S, x, y, o = {}) {
  ctx.save(); ctx.translate(x, y);
  if (o.rot) ctx.rotate(o.rot);
  if (o.flip) ctx.scale(-1, 1);
  if (o.scale) ctx.scale(o.scale, o.scale);

  ctx.drawImage(S.cv, -S.ax, -S.ay, S.w, S.h);
  ctx.restore();
}
function clearCaches() { layerCache.clear(); spriteCache.clear(); }

function outline(c, w) { if (hc) { c.lineWidth = Math.max(2, w * 1.4); c.strokeStyle = "#ffffff"; } else { c.lineWidth = w; c.strokeStyle = "rgba(255,248,225,0.8)"; } c.stroke(); }

  c.restore();
}
function drawCoconut(c, x, by, h, lean) {

    const ex = tx + Math.cos(a) * len, ey = ty + Math.sin(a) * len * 0.35 + len * 0.42;
    const mx = tx + Math.cos(a) * len * 0.55, my = ty + Math.sin(a) * len * 0.7 - len * 0.05;

function drawNipa(c, x, by, h) {        // dừa nước: tàu lá mọc thẳng từ mép nước
  c.save(); c.lineCap = "round";
  for (let i = 0; i < 9; i++) {

function drawBamboo(c, x, by, h) {    // lũy tre

function drawHouse(c, x, by, h, tile) {   // tile=true: nhà ngói đỏ; false: nhà tranh

  c.save();

// ---------- Út Sen ----------
const SEN = { shirt: "#e0663a", shirtDark: "#a8452a", pants: "#1d1b22", skin: "#f0c39a", hair: "#1a1310" };
function khanRan(c, x, y, w, h) {      // dải khăn rằn ca rô đen trắng
  c.save(); pathRR(c, x, y, w, h, h / 2); c.clip();
  c.fillStyle = "#f4f0e6"; c.fillRect(x, y, w, h);
  c.fillStyle = "#1b1b1b"; const cell = Math.max(2, h / 2);
  for (let i = 0; i * cell < w; i++) for (let j = 0; j * cell < h; j++) if ((i + j) % 2 === 0) c.fillRect(x + i * cell, y + j * cell, cell, cell);
  c.restore();
}
function paintSenSwim(c, L, f) {        // nằm ngang, đầu hướng phải; L = chiều dài thân
  const u = L / 10;
  // giỏ lưới đeo sau hông
  c.save(); c.translate(-0.6 * u, -1.25 * u);
  pathRR(c, -1.3 * u, -0.9 * u, 2.6 * u, 1.6 * u, 0.6 * u); c.fillStyle = "#b58a4c"; c.fill();
  c.strokeStyle = "#6d4e24"; c.lineWidth = Math.max(1, u * 0.18); c.stroke();
  c.lineWidth = Math.max(0.6, u * 0.08); for (let i = -1; i <= 1; i++) { c.beginPath(); c.moveTo(i * 0.8 * u, -0.9 * u); c.lineTo(i * 0.8 * u + 0.4 * u, 0.7 * u); c.moveTo(i * 0.8 * u + 0.4 * u, -0.9 * u); c.lineTo(i * 0.8 * u, 0.7 * u); c.stroke(); }
  c.restore();
  // chân đạp nước
  const k = f ? 0.28 : -0.28;
  c.strokeStyle = SEN.pants; c.lineCap = "round"; c.lineWidth = 1.1 * u;
  c.beginPath(); c.moveTo(-1.6 * u, -0.2 * u); c.lineTo(-3.6 * u, (-0.5 + k) * u); c.lineTo(-4.8 * u, (-0.4 + k * 2) * u); c.stroke();
  c.beginPath(); c.moveTo(-1.6 * u, 0.3 * u); c.lineTo(-3.6 * u, (0.6 - k) * u); c.lineTo(-4.8 * u, (0.6 - k * 2) * u); c.stroke();
  c.fillStyle = SEN.skin; for (const yy of [(-0.4 + k * 2), (0.6 - k * 2)]) { c.beginPath(); c.ellipse(-5 * u, yy * u, 0.45 * u, 0.3 * u, 0, 0, 7); c.fill(); }
  // thân áo bà ba
  pathRR(c, -2 * u, -1.05 * u, 4.4 * u, 2.1 * u, 1 * u);
  const g = c.createLinearGradient(0, -1.05 * u, 0, 1.05 * u); g.addColorStop(0, "#f27f4c"); g.addColorStop(1, SEN.shirtDark);
  c.fillStyle = g; c.fill(); outline(c, Math.max(1.2, u * 0.22));
  c.fillStyle = "#fbe3c4"; for (let i = 0; i < 3; i++) { c.beginPath(); c.arc((0.2 + i * 0.7) * u, 0.55 * u, 0.13 * u, 0, 7); c.fill(); }
  // tay vươn về trước
  c.strokeStyle = SEN.skin; c.lineWidth = 0.8 * u;
  c.beginPath(); c.moveTo(1.8 * u, -0.5 * u); c.lineTo(4.6 * u, (-0.9 + (f ? 0.3 : 0)) * u); c.stroke();
  // đầu + tóc + khăn rằn
  c.fillStyle = SEN.skin; c.beginPath(); c.arc(3.4 * u, -0.15 * u, 1.05 * u, 0, 7); c.fill(); outline(c, Math.max(1, u * 0.18));
  c.fillStyle = SEN.hair; c.beginPath(); c.arc(3.15 * u, -0.45 * u, 1.0 * u, Math.PI * 0.95, Math.PI * 2.05); c.fill();
  c.beginPath(); c.arc(2.2 * u, -0.9 * u, 0.5 * u, 0, 7); c.fill();
  khanRan(c, 2.4 * u, -1.0 * u, 2.1 * u, 0.55 * u);
  c.save(); c.translate(1.6 * u, 0.9 * u); khanRan(c, -1.8 * u, -0.3 * u, 2.2 * u, 0.6 * u); c.restore();

    const levels = arr(cat[id]).slice().sort((a, b) => num(a.level) - num(b.level));
    const b = num(bought[id]), a = num(active[id]), nextLv = levels[b];
    ctx.save(); pathRR(ctx, cx, cy, cw, ch, 14); ctx.fillStyle = hc ? "#000" : "rgba(255,246,226,0.96)"; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = hc ? "#fff" : "#b8722f"; ctx.stroke(); ctx.restore();
    const ic = sprite(`upg|${id}|${hc}`, 80, 80, 40, 44, (c) => paintUpgrade(c, id, 26)); drawSprite(ic, cx + 50, cy + 52);
    text(UPG[id] || id, cx + 92, cy + 36, { size: 21, weight: 800, color: "#5a2e10", max: cw - 100 });
    text(`Phím ${i + 1}`, cx + 92, cy + 64, { size: 15, weight: 700, color: "#8a6a4a" });
    // ô cấp: đặc = đang dùng, viền vàng = đã mua chờ Ngày sau, rỗng = chưa mua
    let px = cx + 92;
    for (let lv = 1; lv <= levels.length; lv++) {
      const isActive = lv <= a, isBought = lv <= b;
      pathRR(ctx, px, cy + 80, 34, 18, 5);
      ctx.fillStyle = isActive ? (hc ? "#00ff66" : "#4caf50") : hc ? "#000" : "rgba(0,0,0,0.1)"; ctx.fill();
      ctx.lineWidth = isBought && !isActive ? 3 : 1.5; ctx.strokeStyle = isBought && !isActive ? (hc ? "#ffff00" : "#e6a400") : hc ? "#fff" : "#8a6a4a"; ctx.stroke();
      px += 40;
    }
    text(`Đang dùng: cấp ${a} — ${a ? effectText(id, levels[a - 1]) : baseEffect(id)}`, cx + 16, cy + 124, { size: 15, weight: 700, color: "#2f5f2f", hcColor: "#00ff66", max: cw - 28 });
    text(b > a ? `Đã mua: cấp ${b} — hiệu lực Ngày sau` : `Đã mua: cấp ${b}`, cx + 16, cy + 150, { size: 15, weight: 700, color: b > a ? "#a06a00" : "#5a4a3a", hcColor: b > a ? "#ffff00" : "#fff", max: cw - 28 });
    if (nextLv) {
      const price = num(nextLv.price), can = money >= price;
      text(`Cấp ${num(nextLv.level, b + 1)}: ${effectText(id, nextLv)}`, cx + 16, cy + 184, { size: 16, weight: 800, color: "#3b2a1c", max: cw - 28 });
      text(`Giá ${price}k${can ? "" : ` — thiếu ${price - money}k`}`, cx + 16, cy + 212, { size: 16, weight: 800, color: can ? "#2e7d32" : "#c62828", hcColor: can ? "#00ff66" : "#ff6666" });
      button(can ? `Mua ${price}k  [${i + 1}]` : `Thiếu tiền  [${i + 1}]`, cx + 16, cy + ch - 60, cw - 32, 44, () => buy(id), { size: 18, bg: can ? "rgba(46,125,50,0.95)" : "rgba(120,80,60,0.9)", border: can ? "#a5e88a" : "#d9a080" });
    } else {
      text("Đã đạt cấp tối đa", cx + 16, cy + 196, { size: 17, weight: 800, color: "#6a4a2a" });
      button("Tối đa", cx + 16, cy + ch - 60, cw - 32, 44, () => {}, { disabled: true });
    }
    cx += cw + 20;
  });
  // kết quả ngày + nút đóng
  const py = cy + ch + 16, ph = Math.max(120, H - BOT_H - py - 10), pw = Math.min(620, W * 0.5);
  const px0 = (W > 1100 ? 260 : 20);
  ctx.save(); pathRR(ctx, px0, py, pw, ph, 12); ctx.fillStyle = hc ? "#000" : "rgba(20,26,24,0.88)"; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = hc ? "#fff" : "rgba(255,214,150,0.5)"; ctx.stroke(); ctx.restore();
  const D = ST.day;
  text(`Kết quả Ngày ${s.day ?? ""}`, px0 + 16, py + 22, { size: 19, weight: 800, color: "#ffd58a" });
  const repTxt = D.repStart !== null && D.repEnd !== null ? `${D.repStart.toFixed(1)} → ${D.repEnd.toFixed(1)}` : num(s.reputation).toFixed(1);
  text(`Khách phục vụ ${D.served} · bỏ về ${D.left} · tiền ca ${D.shiftEarned ?? "?"}k · boa ${D.tips}k`, px0 + 16, py + 52, { size: 17, weight: 700, max: pw - 30 });
  text(`Uy tín ${repTxt} · Kho dư: ${Object.entries(obj(s.stock)).map(([k, v]) => `${kindName(k)} ${v}`).join(", ") || "trống"}`, px0 + 16, py + 80, { size: 16, weight: 600, color: "#e6dcc6", max: pw - 30 });
  if (ST.shopMsg && performance.now() - ST.shopMsg.t < 6000) text(ST.shopMsg.text, px0 + 16, py + 108, { size: 16, weight: 800, color: ST.shopMsg.good ? "#a8f08a" : "#ff9f8f", hcColor: ST.shopMsg.good ? "#00ff66" : "#ff6666", max: pw - 30 });
  button("Đóng Shop · sang ngày mới  [Enter]", px0 + pw + 20, py + 10, Math.min(360, W - px0 - pw - 40), 56, () => pulse("shop_done"), { size: 18, bg: "rgba(160,70,30,0.95)", border: "#ffd08a" });
  hudBg(H - BOT_H, BOT_H);
  text("1/2/3 hoặc bấm nút để mua · Enter đóng Shop · P tạm dừng · R chơi lại · C tương phản · M âm thanh", 14, H - BOT_H + 40, { size: 16, color: "#d8cbb0" });
}

// ======================================================================
//  LỚP PHỦ: hạt, chữ nổi, toast, tạm dừng, tổng kết
// ======================================================================
function drawParts(scene, sx, sy) {
  if (!fx()) return;
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    if (p.scene !== scene) continue;
    p.life -= dt;
    if (p.life <= 0) { parts.splice(i, 1); continue; }
    if (p.screen) { p.sx += p.vx * dt; p.sy += p.vy * dt; }
    else { p.x += p.vx * dt; p.y += p.vy * dt; if (p.kind !== "bubble") p.vy += 4 * dt; }
    if (p.kind === "bubble" && p.y <= 0.1) { parts.splice(i, 1); continue; }
    const x = p.screen ? p.sx : sx(p.x), y = p.screen ? p.sy : sy(p.y), a = clamp(p.life / p.max, 0, 1);
    ctx.save(); ctx.globalAlpha = a;
    if (p.kind === "bubble") { ctx.strokeStyle = "rgba(235,250,255,0.85)"; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(x, y, p.r, 0, 7); ctx.stroke(); }
    else if (p.kind === "steam") { ctx.fillStyle = "rgba(245,245,250,0.35)"; ctx.beginPath(); ctx.arc(x, y, p.r * (2 - a), 0, 7); ctx.fill(); }
    else if (p.kind === "leaf") { ctx.fillStyle = "#8fdc6a"; ctx.beginPath(); ctx.ellipse(x, y, p.r, p.r * 0.5, p.life * 6, 0, 7); ctx.fill(); }
    else if (p.kind === "splash") { ctx.fillStyle = "rgba(230,245,255,0.8)"; ctx.beginPath(); ctx.arc(x, y, p.r * 0.7, 0, 7); ctx.fill(); }
    else { ctx.fillStyle = "#fff3a0"; ctx.beginPath(); ctx.arc(x, y, p.r * 0.6, 0, 7); ctx.fill(); }
    ctx.restore();
  }
}
function drawFloats(scene, sx, sy) {
  const now = performance.now();
  for (let i = floats.length - 1; i >= 0; i--) {
    const f = floats[i], t = (now - f.t0) / 1400;
    if (t >= 1) { floats.splice(i, 1); continue; }
    if (f.scene !== scene) continue;
    ctx.save(); ctx.globalAlpha = 1 - t * t;
    text(f.str, sx(f.x), sy(f.y) - 40 * t, { size: 18, weight: 800, align: "center", stroke: true, color: f.col, hcColor: "#ffff00" });
    ctx.restore();
  }
}
function drawToasts() {
  const now = performance.now();
  let y = H - BOT_H - 26;
  for (let i = toasts.length - 1; i >= 0; i--) {
    const t = toasts[i], age = (now - t.t0) / 1000;
    if (age > t.dur) { toasts.splice(i, 1); continue; }
    ctx.save(); ctx.globalAlpha = clamp((t.dur - age) / 0.4, 0, 1);
    const col = t.kind === "warn" ? "#ff6b5a" : t.kind === "good" ? "#8bd46a" : "#f3b267";
    pill(t.str, W - 16, y, { size: 17, h: 34, align: "right", bg: "rgba(24,20,16,0.94)", border: col, hcBorder: t.kind === "warn" ? "#ff3333" : "#ffff00", hcColor: t.kind === "warn" ? "#ffff00" : "#fff" });
    ctx.restore();
    y -= 42;
  }
}
function centerPanel(w, h) {
  const x = (W - w) / 2, y = (H - h) / 2;
  ctx.save(); pathRR(ctx, x, y, w, h, 16); ctx.fillStyle = hc ? "#000" : "rgba(34,26,18,0.97)"; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = hc ? "#fff" : "#e8b766"; ctx.stroke(); ctx.restore();
  return { x, y };
}
function drawPause() {
  hits = [];   // lớp phủ chặn click xuống cảnh bên dưới
  ctx.fillStyle = hc ? "rgba(0,0,0,0.85)" : "rgba(10,10,14,0.6)"; ctx.fillRect(0, 0, W, H);
  const { x, y } = centerPanel(460, 230);
  text("TẠM DỪNG", W / 2, y + 44, { size: 30, weight: 800, align: "center", color: "#ffd58a" });
  text("Đồng hồ ca, oxy, bếp và khách đều đứng yên", W / 2, y + 86, { size: 18, align: "center", color: "#efe3cc" });
  button("▶ Tiếp tục  [P / Esc]", x + 30, y + 130, 230, 54, () => pulse("pause"), { size: 18, bg: "rgba(46,125,50,0.95)", border: "#a5e88a" });
  button("↻ Chơi lại  [R]", x + 280, y + 130, 150, 54, restartGame, { size: 18 });
}
function drawFinished(s) {
  hits = [];
  ctx.fillStyle = hc ? "rgba(0,0,0,0.9)" : "rgba(8,10,12,0.7)"; ctx.fillRect(0, 0, W, H);
  const { x, y } = centerPanel(Math.min(640, W - 40), 380);
  const pw = Math.min(640, W - 40);
  const lines = [];
  let title = "KẾT THÚC";
  if (s.mode === "day") {
    title = s.reason === "days_complete" ? "TỔNG KẾT CHUYẾN CHỢ NỔI" : "LƯỢT CHƠI DỪNG";
    const best = Object.entries(ST.tot.dishes).sort((a, b) => b[1] - a[1])[0];
    lines.push([`Hoàn thành ${ST.tot.daysDone} ngày · đến Ngày ${s.day ?? "?"}`, "#efe3cc"]);
    lines.push([`Tiền còn ${num(s.money)}k · tổng kiếm ${num(s.earned)}k`, "#ffd54f"]);
    lines.push([`Uy tín ${num(s.reputation).toFixed(1)} / 5 · Điểm ${num(s.score)}`, "#b9f6a0"]);
    lines.push([`Khách phục vụ ${ST.tot.served} · bỏ về ${ST.tot.left} · boa ${ST.tot.tips}k`, "#efe3cc"]);
    lines.push([best ? `Món bán chạy: ${dishName(best[0])} (${best[1]} suất)` : "Chưa bán được món nào", "#ffcf9a"]);
  } else if (s.mode === "quan" || s.phase === "quan") {
    title = "QUÁN ĐÓNG CỬA";
    lines.push([`Tiền ${num(s.money)}k · Điểm ${num(s.score)}`, "#ffd54f"]);
    lines.push([`Uy tín ${num(s.reputation).toFixed(1)} / 5`, "#b9f6a0"]);
    lines.push([`Khách phục vụ ${ST.tot.served} · bỏ về ${ST.tot.left} · boa ${ST.tot.tips}k`, "#efe3cc"]);
  } else {
    title = s.reason === "docked" ? "CẬP BẾN AN TOÀN" : s.reason === "fainted" ? "ÚT SEN NGẤT" : "HẾT GIỜ CA SÁNG";
    const { counts } = countKinds(s.hold);
    lines.push([s.reason === "fainted" ? (ST.faintCause === "monster" ? "Bị Cá Sấu Năm Chèo cắn — giỏ trôi mất" : "Ngạt nước — giỏ trôi mất") : "Giỏ đã chốt vào kho", s.reason === "fainted" ? "#ff8a80" : "#a8f08a"]);
    lines.push([`Giỏ: ${Object.entries(counts).map(([k, v]) => `${kindName(k)} ${v}`).join(", ") || "trống"}`, "#efe3cc"]);
    lines.push([`Máu còn ${num(obj(s.player).hp)}`, "#ffb0a0"]);
  }
  if (s.reason === "error" || s.error) lines.push(["Luật game báo lỗi — xem terminal", "#ff6b5a"]);
  text(title, W / 2, y + 48, { size: 28, weight: 800, align: "center", color: "#ffd58a", hcColor: "#ffff00" });
  lines.forEach(([t, col], i) => text(t, W / 2, y + 100 + i * 38, { size: 19, weight: 700, align: "center", color: col, max: pw - 40 }));
  button("↻ Chơi lại  [R]", (W - 240) / 2, y + 380 - 74, 240, 54, restartGame, { size: 19, bg: "rgba(46,125,50,0.95)", border: "#a5e88a" });
}

// ---------- vòng lặp chính ----------
let lastFrame = performance.now(), fpsEma = 60;
window.__chonoi = { get fps() { return fpsEma; }, get scene() { return curScene; } };
function fit() {
  const dpr = window.devicePixelRatio || 1, w = innerWidth, h = innerHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr) || dpr !== DPR) {
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    if (dpr !== DPR || w !== W || h !== H) clearCaches();
    DPR = dpr;
  }
  W = w; H = h;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
function frame(now) {
  requestAnimationFrame(frame);
  dt = clamp((now - lastFrame) / 1000, 0, 0.1); lastFrame = now; T = now / 1000;
  if (dt > 0) fpsEma += (1 / dt - fpsEma) * 0.05;
  fit();
  hits = [];
  ctx.save();
  if (shake > 0 && fx()) { ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake); shake = Math.max(0, shake - dt * 40); }
  ctx.fillStyle = hc ? "#000" : "#10161c"; ctx.fillRect(0, 0, W, H);
  if (snap) {
    const sc = curScene || sceneOf(snap);
    try {
      if (sc === "quan") drawQuan(snap);
      else if (sc === "shop") drawShop(snap);
      else drawGather(snap);
    } catch (e) {
      console.error("render", sc, e);
      text("Lỗi vẽ cảnh — xem console", W / 2, H / 2, { size: 20, align: "center", color: "#ff6b5a" });
    }
    if (flash > 0 && fx()) { ctx.fillStyle = `rgba(255,40,40,${flash * 0.4})`; ctx.fillRect(0, 0, W, H); flash = Math.max(0, flash - dt * 1.5); }
    drawToasts();
    if (offline) pill("Mất kết nối tới máy chủ — kiểm tra tiến trình chonoi.live", W / 2, HUD_H + 120, { size: 18, border: "#ff6b5a" });
    if (snap.finished) drawFinished(snap);
    else if (snap.state === "paused") drawPause();
  } else {
    text(offline ? "Không kết nối được máy chủ…" : "Đang tải chợ nổi…", W / 2, H / 2, { size: 22, align: "center", color: "#cbbfa8" });
  }
  ctx.restore();
  if (showFps) text(`${fpsEma.toFixed(0)} FPS`, W - 12, H - BOT_H - 12, { size: 14, align: "right", stroke: true });
}
resetClient();
poll();
requestAnimationFrame(frame);
</script>
