    text(`x: ${ p.pos[0].toFixed(1) } m · d: ${ p.pos[1].toFixed(1) } m`, 120, 34, { size: 12, color: "#9fb3c0" });
  }

  // 3. Thanh Oxy — Nhấp nháy nhanh dần khi gần 0 (Ticket 03 Phase 4)
  if (p && p.oxygen_ticks !== undefined && p.oxygen_max_ticks) {
    const oxyRatio = p.oxygen_ticks / p.oxygen_max_ticks;
    const isOxyLow = oxyRatio < 0.25;
    const isOxyMed = oxyRatio < 0.5;

    // Tần số nhấp nháy nhanh dần khi gần cạn oxy
    const flashSpeed = Math.max(2, Math.floor(oxyRatio * 20));
    const blink = Math.floor((snap?.tick || 0) / flashSpeed) % 2 === 0;

    let oxyColor = "#4fc3f7";
    let oxyLabel = "Oxy: " + Math.ceil(p.oxygen_ticks / 60) + "s";
    if (isOxyLow) {
      oxyColor = blink ? "#ff1744" : (highContrast ? "#ffff00" : "#ff8a80");
      oxyLabel = `🫁 HẾT HƠI: ${ Math.ceil(p.oxygen_ticks / 60) } s!`;
    } else if (isOxyMed) {
      oxyColor = "#ffa726";
    }
    bar(w / 2 - 120, 18, 240, 20, oxyRatio, oxyColor, oxyLabel);
  }

  // 4. Máu
  if (p && p.hp !== undefined && p.hp_max) {
    let hearts = "";
    for (let i = 0; i < p.hp_max; i++) hearts += i < p.hp ? "♥ " : "♡ ";
    text("Máu:", w - 390, 35, { size: 14, color: "#b0bec5", weight: "bold" });
    text(hearts, w - 340, 36, { size: 20, color: p.hp <= 1 ? "#ff1744" : "#ff5252", weight: "bold" });
  }

  // 5. Nút Chế độ tương phản cao (Ticket 03 Phase 4)
  contrastBtnRect = { x: w - 240, y: 14, w: 124, h: 28 };
  roundRect(ctx, contrastBtnRect.x, contrastBtnRect.y, contrastBtnRect.w, contrastBtnRect.h, 6);
  ctx.fillStyle = highContrast ? "#ffff00" : "rgba(255, 255, 255, 0.08)";
  ctx.fill();
  ctx.strokeStyle = highContrast ? "#ffffff" : "rgba(255, 255, 255, 0.25)";
  ctx.lineWidth = highContrast ? 2 : 1;
  ctx.stroke();
  text(highContrast ? "👁️ Tương phản (C)" : "👁️ Chuẩn (C)", contrastBtnRect.x + contrastBtnRect.w / 2, contrastBtnRect.y + contrastBtnRect.h / 2, {
    size: 11, align: "center", base: "middle", weight: "bold",
    color: highContrast ? "#000000" : "#9fb3c0"
  });

  // 6. Nút Âm thanh
  soundBtnRect = { x: w - 110, y: 14, w: 96, h: 28 };
  roundRect(ctx, soundBtnRect.x, soundBtnRect.y, soundBtnRect.w, soundBtnRect.h, 6);
  ctx.fillStyle = soundEnabled ? "rgba(41, 182, 246, 0.25)" : "rgba(255, 255, 255, 0.08)";
  ctx.fill();
  ctx.strokeStyle = soundEnabled ? "#29b6f6" : "rgba(255, 255, 255, 0.25)";
  ctx.stroke();
  text(soundEnabled ? "🔊 Bật (M)" : "🔇 Tắt (M)", soundBtnRect.x + soundBtnRect.w / 2, soundBtnRect.y + soundBtnRect.h / 2, {
    size: 11, align: "center", base: "middle", weight: "bold", color: soundEnabled ? "#81d4fa" : "#9fb3c0"
  });

  if (contextualPrompt) {
    drawPrompt(contextualPrompt.text, w / 2, 92, {
      color: contextualPrompt.color,
      border: contextualPrompt.border,
      bg: contextualPrompt.bg,
      size: 13
    });
  }

  // ===== HUD DƯỚI: Giỏ hàng + Hiển thị độ tươi / Ươn (Ticket 05 Phase 3) =====
  ctx.fillStyle = "rgba(12, 20, 28, 0.9)";
  ctx.fillRect(0, h - bottom, w, bottom);
  ctx.strokeStyle = "rgba(255,255,255,0.1)";
  ctx.beginPath(); ctx.moveTo(0, h - bottom); ctx.lineTo(w, h - bottom); ctx.stroke();

  if (snap?.hold !== undefined && snap?.hold_capacity) {
    const cap = snap.hold_capacity;
    const holdItems = snap.hold || [];
    const sz = Math.min(28, Math.floor((w / 2 - 20) / cap) - 4);
    const startX = 16, startY = h - bottom + 8;

    let spoiledCount = 0;
    const counts = {};

    for (let i = 0; i < cap; i++) {
      const bx = startX + i * (sz + 4);
      roundRect(ctx, bx, startY, sz, sz, 4);
      ctx.fillStyle = "rgba(255,255,255,0.08)";
      ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,0.2)";
      ctx.stroke();

      const it = holdItems[i];
      if (it) {
        const isObj = typeof it === "object" && it !== null;
        const kind = isObj ? it.kind : it;
        const fresh = isObj ? it.fresh : undefined;
        const isSpoiled = fresh !== undefined && fresh < 30;
        if (isSpoiled) spoiledCount++;
        counts[kind] = (counts[kind] || 0) + 1;

        roundRect(ctx, bx + 2, startY + 2, sz - 4, sz - 4, 3);
        ctx.fillStyle = isSpoiled ? "rgba(90, 80, 80, 0.6)" : kc(kind);
        ctx.fill();

        // Hiển thị thanh độ tươi hoặc nhãn ƯƠN (Ticket 05)
        if (fresh !== undefined) {
          if (isSpoiled) {
            ctx.strokeStyle = "#ff1744";
            ctx.lineWidth = 1.8;
            ctx.beginPath();
            ctx.moveTo(bx + 3, startY + 3);
            ctx.lineTo(bx + sz - 3, startY + sz - 3);
            ctx.stroke();
            text("ƯƠN", bx + sz / 2, startY + sz / 2 + 1, {
              size: 8, align: "center", base: "middle", weight: "bold", color: "#ff8a80"
            });
          } else {
            const fRatio = Math.max(0, Math.min(1, fresh / 100));
            const fCol = fresh >= 70 ? "#69f0ae" : "#ffd54f";
            ctx.fillStyle = "rgba(0,0,0,0.6)";
            ctx.fillRect(bx + 2, startY + sz - 5, sz - 4, 3);
            ctx.fillStyle = fCol;
            ctx.fillRect(bx + 2, startY + sz - 5, (sz - 4) * fRatio, 3);
          }
        }
      }
    }

    const summary = Object.keys(counts).map((k) => (KIND_NAME[k] || k) + " ×" + counts[k]).join(" · ");
    let giỏLabel = `Giỏ(${ holdItems.length } / ${ cap })` + (summary ? `: ${ summary } ` : " (Đang trống)");
    if (spoiledCount > 0) {
      giỏLabel += ` · ⚠️ Có ${ spoiledCount } món đã ươn!`;
    }
    text(giỏLabel, 16, h - bottom + sz + 23, { size: 12, color: spoiledCount > 0 ? "#ff8a80" : "#cfd8dc", weight: "bold" });
  }

  text("WASD: Bơi · E: Hái / Cập bến · Space: Bắt cá · R: Chơi lại", w - 16, h - 22, {
    size: 12, align: "right", color: "#9fb3c0"
  });
}

// ----- CẢNH QUÁN: Buổi tối -----
function drawQuan(w, h) {
  const meta = snap?.meta || {};
  const b = meta.bounds || { x: [0, 16], z: [0, 10] };
  const X = b.x[1] || 16, Z = b.z[1] || 10;
  const top = 68, bottom = 64;
  const s = Math.max(1, Math.min((w - 48) / X, (h - top - bottom) / Z));
  const ox = (w - s * X) / 2, oy = top;
  const sx = (x) => ox + x * s, sy = (z) => oy + (Z - z) * s;

  if (highContrast) {
    ctx.fillStyle = "#000000";
    ctx.fillRect(sx(0), sy(Z), X * s, Z * s);
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 3;
    ctx.strokeRect(sx(0), sy(Z), X * s, Z * s);
  } else {
    ctx.fillStyle = "#b88e58";
    ctx.fillRect(sx(0), sy(Z), X * s, Z * s);
    ctx.strokeStyle = "#5a3a1f";
    ctx.lineWidth = 4;
    ctx.strokeRect(sx(0), sy(Z), X * s, Z * s);

    ctx.strokeStyle = "rgba(0,0,0,0.06)";
    ctx.lineWidth = 1;
    for (let x = 1; x < X; x++) {
      ctx.beginPath(); ctx.moveTo(sx(x), sy(0)); ctx.lineTo(sx(x), sy(Z)); ctx.stroke();
    }
  }

  // Bếp
  const stoves = snap?.stoves || [];
  stoves.forEach((st) => {
    const isCooking = st.state === "cooking";
    const isReady = st.state === "ready";
    let col = isCooking ? "#f57c00" : isReady ? "#43a047" : "#546e7a";
    let strokeCol = isReady ? "#b9f6ca" : "rgba(255,255,255,0.4)";
    if (highContrast) {
      col = "#000000";
      strokeCol = isReady ? "#00ff66" : isCooking ? "#ffff00" : "#ffffff";
    }
    
    roundRect(ctx, sx(st.pos[0]) - 0.9 * s, sy(st.pos[1]) - 0.9 * s, 1.8 * s, 1.8 * s, 6);
    ctx.fillStyle = col;
    ctx.fill();
    ctx.strokeStyle = strokeCol;
    ctx.lineWidth = highContrast ? 2.5 : 2;
    ctx.stroke();

    text("Bếp " + st.id, sx(st.pos[0]), sy(st.pos[1]) + 4, { size: 12, align: "center", weight: "bold", color: "#ffffff" });
    if (st.dish) {
      const icon = DISH_ICON[st.dish] || "🍲";
      text(icon + " " + (DISH_NAME[st.dish] || st.dish), sx(st.pos[0]), sy(st.pos[1]) - 1.05 * s, {
        size: 10, align: "center", weight: "bold", color: highContrast ? "#ffff00" : "#1a0f05"
      });
    }
    if (isCooking && st.cook_ticks_left !== undefined) {
      text("⏳ " + Math.ceil(st.cook_ticks_left / 60) + "s", sx(st.pos[0]), sy(st.pos[1]) + 1.35 * s, {
        size: 11, align: "center", weight: "bold", color: highContrast ? "#ffffff" : "#212121"
      });
    } else if (isReady) {
      text("✨ SẴN SÀNG", sx(st.pos[0]), sy(st.pos[1]) + 1.35 * s, {
        size: 10, align: "center", weight: "bold", color: highContrast ? "#00ff66" : "#1b5e20"
      });
    }
  });

  // Khói bếp
  if (!noFx && !highContrast) {
    ctx.save();
    steams.forEach((sm) => {
      ctx.fillStyle = `rgba(240, 240, 245, ${ sm.alpha * 0.45 })`;
      ctx.beginPath();
      ctx.arc(sx(sm.x), sy(sm.z), sm.r, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.restore();
  }

  // Bàn & Khách
  const patMax = (meta.patience_s || 60) * 60;
  const byTable = {};
  (snap?.customers || []).forEach((c) => (byTable[c.table_id] = c));
  const tables = snap?.tables || [];
  let urgentCustomerBanner = null;

  tables.forEach((tb) => {
    let tbFill = "#6d4c41";
    let tbStroke = "#3e2723";
    if (highContrast) {
      tbFill = "#000000";
      tbStroke = "#ffffff";
    }
    roundRect(ctx, sx(tb.pos[0]) - 1.0 * s, sy(tb.pos[1]) - 0.9 * s, 2.0 * s, 1.8 * s, 8);
    ctx.fillStyle = tbFill;
    ctx.fill();
    ctx.strokeStyle = tbStroke;
    ctx.lineWidth = highContrast ? 2.5 : 2;
    ctx.stroke();
    text("Bàn " + tb.id, sx(tb.pos[0]), sy(tb.pos[1]) + 4, { size: 12, align: "center", weight: "bold", color: "#ffffff" });

    const c = byTable[tb.id];
    if (c) {
      const cx = sx(tb.pos[0]), cy = sy(tb.pos[1]) - 1.6 * s;
      const isEating = c.state === "eating";
      
      let cCol = isEating ? "#81c784" : "#ff80ab";
      let cBorder = "#ffffff";
      if (highContrast) {
        cCol = isEating ? "#00ff66" : "#ffffff";
        cBorder = "#ffffff";
      }
      ctx.fillStyle = cCol;
      ctx.beginPath();
      ctx.arc(cx, cy, 0.6 * s, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = cBorder;
      ctx.lineWidth = 1.5;
      ctx.stroke();

      const dishName = DISH_NAME[c.dish_id] || c.dish_id || "?";
      const dishIcon = DISH_ICON[c.dish_id] || "🍲";
      text(dishIcon + " " + dishName, cx, cy - 0.85 * s, {
        size: 10, align: "center", weight: "bold", color: highContrast ? "#ffff00" : "#1a0f05"
      });

      if (!isEating && c.patience_ticks_left !== undefined) {
        const pRatio = c.patience_ticks_left / patMax;
        const pCol = pRatio < 0.25 ? "#ff1744" : pRatio < 0.5 ? "#ffa726" : "#4caf50";
        bar(cx - 0.9 * s, cy + 0.7 * s, 1.8 * s, 6, pRatio, pCol);

        // CẢNH BÁO NGUY HIỂM 3: KHÁCH SẮP GIẬN (< 25% kiên nhẫn)
        if (pRatio < 0.25) {
          const secLeft = Math.ceil(c.patience_ticks_left / 60);
          const blink = Math.floor(Date.now() / 250) % 2 === 0;

          // Viền cảnh báo nhấp nháy đỏ/vàng quanh bàn
          ctx.save();
          ctx.strokeStyle = blink ? "#ff1744" : "#ffea00";
          ctx.lineWidth = 3;
          ctx.setLineDash([5, 3]);
          roundRect(ctx, sx(tb.pos[0]) - 1.15 * s, sy(tb.pos[1]) - 1.05 * s, 2.3 * s, 2.1 * s, 10);
          ctx.stroke();
          ctx.restore();

          // Nhãn chữ + biểu tượng rõ ràng
          text(`😡 KHÁCH SẮP GIẬN!(${ secLeft }s)`, cx, cy - 1.45 * s, {
            size: 11,
            align: "center",
            weight: "bold",
            color: blink ? "#ff1744" : "#ffffff",
            stroke: true,
            strokeColor: "#000000"
          });

          if (!urgentCustomerBanner) {
            urgentCustomerBanner = `Bàn ${ tb.id }: 😡 KHÁCH SẮP GIẬN(${ secLeft }s)!`;
          }
        }
      } else if (isEating) {
        text("😋 Đang ăn...", cx, cy + 0.85 * s, { size: 10, align: "center", color: highContrast ? "#00ff66" : "#2e7d32", weight: "bold" });
      }
    }
  });

  // Người chơi
  const p = snap?.player;
  let quanPrompt = null;
  if (p && p.pos) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    const iRad = meta.interact_radius || 1.5;

    ctx.strokeStyle = highContrast ? "#ffffff" : "rgba(255,255,255,0.4)";
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.arc(px, py, iRad * s, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = highContrast ? "#ffffff" : "#ff8a3d";
    ctx.beginPath();
    ctx.arc(px, py, 0.55 * s, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = highContrast ? "#000000" : "#ffffff";
    ctx.lineWidth = 2;
    ctx.stroke();

    if (snap.hand) {
      const handDish = typeof snap.hand === "string" ? snap.hand : (snap.hand.dish_id || "món");
      const icon = DISH_ICON[handDish] || "🍲";
      text(icon + " " + (DISH_NAME[handDish] || handDish), px, py - 0.9 * s, {
        size: 11, align: "center", weight: "bold", color: "#fff", stroke: true
      });
    }

    let nearStove = null, minSDist = Infinity;
    stoves.forEach((st) => {
      const d = Math.hypot(p.pos[0] - st.pos[0], p.pos[1] - st.pos[1]);
      if (d <= iRad && d < minSDist) { minSDist = d; nearStove = st; }
    });

    let nearTable = null, minTDist = Infinity;
    tables.forEach((tb) => {
      const d = Math.hypot(p.pos[0] - tb.pos[0], p.pos[1] - tb.pos[1]);
      if (d <= iRad && d < minTDist) { minTDist = d; nearTable = tb; }
    });

    if (nearStove) {
      if (nearStove.state === "ready") {
        quanPrompt = snap.hand
          ? { text: "⚠️ Tay đang bận cầm món khác!", color: "#ff8a80", border: "#ff5252" }
          : { text: `🍲 Nhấn[E] Bưng ${ DISH_NAME[nearStove.dish] || nearStove.dish } từ Bếp ${ nearStove.id } `, color: "#69f0ae", border: "#00e676" };
      } else if (nearStove.state === "idle") {
        quanPrompt = { text: `🍳 Nhấn[E] Bắt đầu nấu tại Bếp ${ nearStove.id } `, color: "#ffffff", border: "#ffca28" };
      } else if (nearStove.state === "cooking") {
        quanPrompt = { text: `⏳ Bếp ${ nearStove.id } đang nấu... (${ Math.ceil((nearStove.cook_ticks_left || 0) / 60) }s)`, color: "#ffb74d", border: "#ffa726" };
      }
    } else if (nearTable) {
      const c = byTable[nearTable.id];
      if (c && c.state === "waiting") {
        const handDish = typeof snap.hand === "string" ? snap.hand : (snap.hand?.dish_id || null);
        if (handDish && handDish === c.dish_id) {
          quanPrompt = { text: `✨ Nhấn[E] Phục vụ Bàn ${ nearTable.id } (${ DISH_NAME[c.dish_id] || c.dish_id })`, color: "#69f0ae", border: "#00e676" };
        } else if (handDish) {
          quanPrompt = { text: `⚠️ Món trên tay không đúng!(Khách gọi: ${ DISH_NAME[c.dish_id] || c.dish_id })`, color: "#ff8a80", border: "#ff5252" };
        } else {
          quanPrompt = { text: `Khách Bàn ${ nearTable.id } đang đợi món: ${ DISH_NAME[c.dish_id] || c.dish_id } `, color: "#ffd54f", border: "#ffca28" };
        }
      } else if (c && c.state === "eating") {
        quanPrompt = { text: `Bàn ${ nearTable.id }: Khách đang thưởng thức món ăn`, color: "#b0bec5", border: "#78909c" };
      }
    }
  }

  // ===== HUD TRÊN =====
  ctx.fillStyle = highContrast ? "#000000" : "rgba(12, 20, 28, 0.88)";
  ctx.fillRect(0, 0, w, 56);
  ctx.strokeStyle = highContrast ? "#ffffff" : "rgba(255,255,255,0.1)";
  ctx.lineWidth = highContrast ? 2.5 : 1;
  ctx.beginPath(); ctx.moveTo(0, 56); ctx.lineTo(w, 56); ctx.stroke();

  const timeLeft = snap?.time_left_ticks ?? 0;
  const dayStr = snap?.day ? ` · 📅 Ngày ${snap.day}` : "";
  text("⏱ " + fmtTime(timeLeft) + dayStr, 16, 36, {
    size: 20, weight: "bold", color: timeLeft < 1800 ? "#ff5252" : "#e8eef2"
  });

  const money = snap?.money ?? 0;
  const rep = (snap?.reputation ?? 0).toFixed(1);
  const score = snap?.score ?? 0;
  const mX = snap?.day ? 190 : 120;
  text(`💰 Tiền: ${money}k`, mX, 35, { size: 15, weight: "bold", color: highContrast ? "#ffff00" : "#ffd54f" });
  text(`⭐ Uy tín: ${rep} / 5.0`, mX + 110, 35, { size: 15, weight: "bold", color: highContrast ? "#00ffff" : "#81d4fa" });
  text(`🏆 Điểm: ${score}`, mX + 240, 35, { size: 15, weight: "bold", color: highContrast ? "#00ff66" : "#a5d6a7" });

      const handDish = typeof snap?.hand === "string" ? snap.hand : (snap?.hand?.dish_id || null);
      const handLabel = handDish ? `🍲 Tay: ${DISH_NAME[handDish] || handDish}` : "✋ Tay trống";
      text(handLabel, w - 380, 35, {
        size: 14, weight: "bold", color: handDish ? (highContrast ? "#00ff66" : "#69f0ae") : "#b0bec5"
      });

      // Nút Chế độ tương phản cao
      contrastBtnRect = { x: w - 240, y: 14, w: 122, h: 28 };
      roundRect(ctx, contrastBtnRect.x, contrastBtnRect.y, contrastBtnRect.w, contrastBtnRect.h, 6);
      ctx.fillStyle = highContrast ? "#ffffff" : "rgba(255, 255, 255, 0.08)";
      ctx.fill();
      ctx.strokeStyle = highContrast ? "#ffffff" : "rgba(255, 255, 255, 0.25)";
      ctx.stroke();
      text(highContrast ? "👁️ Tương phản: BẬT" : "👁️ Tương phản (C)", contrastBtnRect.x + contrastBtnRect.w / 2, contrastBtnRect.y + contrastBtnRect.h / 2, {
        size: 11, align: "center", base: "middle", weight: "bold", color: highContrast ? "#000000" : "#cfd8dc"
      });

      // Nút Âm thanh
      soundBtnRect = { x: w - 110, y: 14, w: 96, h: 28 };
      roundRect(ctx, soundBtnRect.x, soundBtnRect.y, soundBtnRect.w, soundBtnRect.h, 6);
      ctx.fillStyle = soundEnabled ? (highContrast ? "#00ffff" : "rgba(41, 182, 246, 0.25)") : "rgba(255, 255, 255, 0.08)";
      ctx.fill();
      ctx.strokeStyle = soundEnabled ? (highContrast ? "#ffffff" : "#29b6f6") : "rgba(255, 255, 255, 0.25)";
      ctx.stroke();
      text(soundEnabled ? "🔊 Bật (M)" : "🔇 Tắt (M)", soundBtnRect.x + soundBtnRect.w / 2, soundBtnRect.y + soundBtnRect.h / 2, {
        size: 11, align: "center", base: "middle", weight: "bold", color: soundEnabled ? (highContrast ? "#000000" : "#81d4fa") : "#9fb3c0"
      });

      // Banner Khách Sắp Giận trên HUD
      if (urgentCustomerBanner) {
        const bannerBlink = Math.floor(Date.now() / 250) % 2 === 0;
        const bw = 360, bh = 30;
        const bx = (w - bw) / 2, by = 64;
        roundRect(ctx, bx, by, bw, bh, 6);
        ctx.fillStyle = bannerBlink ? "rgba(183, 28, 28, 0.95)" : "rgba(255, 23, 68, 0.95)";
        ctx.fill();
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 2;
        ctx.stroke();
        text("⚠️ " + urgentCustomerBanner, w / 2, by + bh / 2, {
          size: 13, align: "center", base: "middle", weight: "bold", color: "#ffffff", stroke: true
        });
      }

  // Bảng thực đơn tối theo kế hoạch ngày của Má Tư (Ticket 06 Phase 2)
  if (snap?.day_plan && snap.day_plan.dishes) {
    const pDishes = snap.day_plan.dishes;
    const dKeys = Object.keys(pDishes);
    if (dKeys.length > 0) {
      const pw = 240, ph = 24 + dKeys.length * 20;
      const px = 16, py = 64;
      roundRect(ctx, px, py, pw, ph, 6);
      ctx.fillStyle = highContrast ? "#000000" : "rgba(12, 20, 28, 0.88)";
      ctx.fill();
      ctx.strokeStyle = highContrast ? "#ffffff" : "rgba(255, 255, 255, 0.2)";
      ctx.lineWidth = highContrast ? 2 : 1;
      ctx.stroke();

      text(`📋 THỰC ĐƠN TỐI (NGÀY ${snap.day || 1})`, px + 10, py + 16, {
        size: 11, weight: "bold", color: highContrast ? "#ffff00" : "#ffd54f"
      });
      dKeys.forEach((dId, idx) => {
        const count = pDishes[dId];
        const icon = DISH_ICON[dId] || "🍲";
        const dName = DISH_NAME[dId] || dId;
        text(`${icon} ${dName}: ${count} suất`, px + 12, py + 34 + idx * 20, {
          size: 11, color: highContrast ? "#ffffff" : "#e0e0e0"
        });
      });
    }
  }

      if (quanPrompt) {
        drawPrompt(quanPrompt.text, w / 2, urgentCustomerBanner ? 104 : 92, {
          color: quanPrompt.color,
          border: quanPrompt.border,
          size: 13
        });
      }

      // ===== HUD DƯỚI: Kho hàng nguyên liệu & hàng ươn (Ticket 05 Phase 3) =====
      ctx.fillStyle = highContrast ? "#000000" : "rgba(12, 20, 28, 0.9)";
      ctx.fillRect(0, h - bottom, w, bottom);
      ctx.strokeStyle = highContrast ? "#ffffff" : "rgba(255,255,255,0.1)";
      ctx.lineWidth = highContrast ? 2.5 : 1;
      ctx.beginPath(); ctx.moveTo(0, h - bottom); ctx.lineTo(w, h - bottom); ctx.stroke();

      let stockStr = "";
      if (Array.isArray(snap?.stock)) {
        const freshItems = snap.stock.filter((it) => it.fresh === undefined || it.fresh >= 30);
        const spoiledItems = snap.stock.filter((it) => it.fresh !== undefined && it.fresh < 30);
        const freshCounts = {};
        freshItems.forEach((it) => (freshCounts[it.kind] = (freshCounts[it.kind] || 0) + 1));
        const freshPart = Object.keys(freshCounts).map((k) => (KIND_NAME[k] || k) + " ×" + freshCounts[k]).join(" · ");
        stockStr = freshPart || "(Hết nguyên liệu tươi)";
        if (spoiledItems.length > 0) {
          stockStr += ` | ⚠️ ${spoiledItems.length} hàng ươn (không thể dùng)`;
        }
      } else if (typeof snap?.stock === "object" && snap.stock !== null) {
        const stockKeys = Object.keys(snap.stock).filter((k) => snap.stock[k] > 0);
        stockStr = stockKeys.length > 0
          ? stockKeys.map((k) => (KIND_NAME[k] || k) + " ×" + snap.stock[k]).join(" · ")
          : "(Kho hết nguyên liệu)";
      } else {
        stockStr = "(Kho trống)";
      }
      text("📦 Kho dự trữ: " + stockStr, 16, h - 24, { size: 13, color: "#ffffff", weight: "bold" });

      text("WASD: Đi lại · E: Tương tác (Bếp / Bàn) · C: Tương phản · R: Chơi lại", w - 16, h - 24, {
        size: 12, align: "right", color: "#9fb3c0"
      });
    }

  text("WASD: Đi lại · E: Tương tác (Bếp / Bàn) · C: Tương phản · P: Tạm dừng · R: Chơi lại", w - 16, h - 24, {
    size: 12, align: "right", color: "#9fb3c0"
  });
}

// ----- CẢNH SHOP: Cửa hàng ban đêm (Ticket 05 / 06 Phase 2) -----
function drawShop(w, h) {
  shopBtnRects = [];

  ctx.fillStyle = highContrast ? "#000000" : "#0c1724";
  ctx.fillRect(0, 0, w, h);

  // HUD Trên của Shop
  ctx.fillStyle = highContrast ? "#000000" : "rgba(12, 20, 28, 0.88)";
  ctx.fillRect(0, 0, w, 56);
  ctx.strokeStyle = highContrast ? "#ffffff" : "rgba(255,255,255,0.1)";
  ctx.lineWidth = highContrast ? 2.5 : 1;
  ctx.beginPath(); ctx.moveTo(0, 56); ctx.lineTo(w, 56); ctx.stroke();

  const timeLeft = snap?.time_left_ticks ?? 0;
  const secLeft = Math.ceil(timeLeft / 60);
  text(`🏪 TIỆM TẠP HÓA ĐÊM (NGÀY ${snap?.day || 1})`, 16, 36, {
    size: 18, weight: "bold", color: highContrast ? "#ffff00" : "#ffd54f"
  });
  text(`⏱ Đóng sau: ${secLeft}s`, 320, 36, {
    size: 15, weight: "bold", color: secLeft <= 3 ? "#ff1744" : "#e8eef2"
  });
  text(`💰 Tiền hiện có: ${snap?.money ?? 0}k`, 480, 36, {
    size: 16, weight: "bold", color: highContrast ? "#00ff66" : "#ffd54f"
  });

  // Nút Tương phản
  contrastBtnRect = { x: w - 240, y: 14, w: 122, h: 28 };
  roundRect(ctx, contrastBtnRect.x, contrastBtnRect.y, contrastBtnRect.w, contrastBtnRect.h, 6);
  ctx.fillStyle = highContrast ? "#ffffff" : "rgba(255, 255, 255, 0.08)";
  ctx.fill();
  ctx.strokeStyle = highContrast ? "#ffffff" : "rgba(255, 255, 255, 0.25)";
  ctx.stroke();
  text(highContrast ? "👁️ Tương phản: BẬT" : "👁️ Tương phản (C)", contrastBtnRect.x + contrastBtnRect.w / 2, contrastBtnRect.y + contrastBtnRect.h / 2, {
    size: 11, align: "center", base: "middle", weight: "bold", color: highContrast ? "#000000" : "#cfd8dc"
  });

  // Nút Âm thanh
  soundBtnRect = { x: w - 110, y: 14, w: 96, h: 28 };
  roundRect(ctx, soundBtnRect.x, soundBtnRect.y, soundBtnRect.w, soundBtnRect.h, 6);
  ctx.fillStyle = soundEnabled ? (highContrast ? "#00ffff" : "rgba(41, 182, 246, 0.25)") : "rgba(255, 255, 255, 0.08)";
  ctx.fill();
  ctx.strokeStyle = soundEnabled ? (highContrast ? "#ffffff" : "#29b6f6") : "rgba(255, 255, 255, 0.25)";
  ctx.stroke();
  text(soundEnabled ? "🔊 Bật (M)" : "🔇 Tắt (M)", soundBtnRect.x + soundBtnRect.w / 2, soundBtnRect.y + soundBtnRect.h / 2, {
    size: 11, align: "center", base: "middle", weight: "bold", color: soundEnabled ? (highContrast ? "#000000" : "#81d4fa") : "#9fb3c0"
  });

  // Thân Shop
  const mw = Math.min(800, w - 40);
  const mh = Math.min(460, h - 130);
  const mx = (w - mw) / 2, my = 75;

  roundRect(ctx, mx, my, mw, mh, 12);
  ctx.fillStyle = highContrast ? "#000000" : "rgba(16, 26, 38, 0.95)";
  ctx.fill();
  ctx.strokeStyle = highContrast ? "#ffffff" : "rgba(255, 255, 255, 0.2)";
  ctx.lineWidth = highContrast ? 2.5 : 1.5;
  ctx.stroke();

  text("TRANG BỊ NÂNG CẤP CHO ÚT SEN", w / 2, my + 34, {
    size: 18, weight: "bold", align: "center", color: highContrast ? "#ffffff" : "#e0e0e0"
  });
  text("Nâng cấp sẽ có hiệu lực từ buổi sáng Ngày kế tiếp", w / 2, my + 56, {
    size: 12, align: "center", color: "#9fb3c0"
  });

  const catalog = [
    {
      key: "oxygen",
      keyNum: "1",
      name: "Bình Lặn Khí Oxy",
      icon: "🤿",
      levels: [
        { level: 1, price: 200, desc: "Tăng oxy lên 45 giây (+15s)" },
        { level: 2, price: 400, desc: "Tăng oxy lên 60 giây (+30s)" }
      ]
    },
    {
      key: "hp",
      keyNum: "2",
      name: "Áo Phao Cứu Sinh (Máu)",
      icon: "🦺",
      levels: [
        { level: 1, price: 250, desc: "Tăng Máu tối đa lên 4 ♥ (+1)" },
        { level: 2, price: 500, desc: "Tăng Máu tối đa lên 5 ♥ (+2)" }
      ]
    },
    {
      key: "net",
      keyNum: "3",
      name: "Vợt Cá Cải Tiến",
      icon: "🕸️",
      levels: [
        { level: 1, price: 250, desc: "Bán kính 4.0m, bắt 2 đàn/lần" },
        { level: 2, price: 500, desc: "Bán kính 6.0m, bắt 3 đàn/lần" }
      ]
    }
  ];

  const curMoney = snap?.money ?? 0;
  const upgrades = snap?.upgrades || {};
  const cardW = (mw - 50) / 3;
  const cardH = 220;

  catalog.forEach((item, idx) => {
    const cx = mx + 16 + idx * (cardW + 9);
    const cy = my + 80;
    const curLvl = upgrades[item.key] || 0;
    const nextLvl = curLvl < item.levels.length ? item.levels[curLvl] : null;

    roundRect(ctx, cx, cy, cardW, cardH, 8);
    ctx.fillStyle = highContrast ? "#111111" : "rgba(255, 255, 255, 0.04)";
    ctx.fill();
    ctx.strokeStyle = highContrast ? "#ffffff" : "rgba(255, 255, 255, 0.15)";
    ctx.lineWidth = 1;
    ctx.stroke();

    text(`${item.icon} ${item.name}`, cx + cardW / 2, cy + 28, {
      size: 13, weight: "bold", align: "center", color: highContrast ? "#ffff00" : "#ffffff"
    });
    text(`Cấp hiện tại: ${curLvl}/${item.levels.length}`, cx + cardW / 2, cy + 50, {
      size: 11, align: "center", color: "#9fb3c0"
    });

    if (nextLvl) {
      text(`Cấp ${nextLvl.level}: ${nextLvl.desc}`, cx + cardW / 2, cy + 85, {
        size: 11, align: "center", color: "#e0e0e0"
      });
      text(`Giá: ${nextLvl.price}k`, cx + cardW / 2, cy + 115, {
        size: 14, weight: "bold", align: "center", color: curMoney >= nextLvl.price ? "#ffd54f" : "#ff8a80"
      });

      const btnW = cardW - 24, btnH = 34;
      const bx = cx + 12, by = cy + cardH - 50;
      const canAfford = curMoney >= nextLvl.price;

      roundRect(ctx, bx, by, btnW, btnH, 6);
      ctx.fillStyle = canAfford ? (highContrast ? "#00ff66" : "#2e7d32") : "rgba(255, 255, 255, 0.05)";
      ctx.fill();
      ctx.strokeStyle = canAfford ? (highContrast ? "#ffffff" : "#66bb6a") : "rgba(255, 255, 255, 0.2)";
      ctx.lineWidth = 1.5;
      ctx.stroke();

      const btnLabel = canAfford ? `MUA [Phím ${item.keyNum}]` : "CHƯA ĐỦ TIỀN";
      text(btnLabel, bx + btnW / 2, by + btnH / 2, {
        size: 12, weight: "bold", align: "center", base: "middle",
        color: canAfford ? (highContrast ? "#000000" : "#ffffff") : "#78909c"
      });

      if (canAfford) {
        shopBtnRects.push({ key: item.key, x: bx, y: by, w: btnW, h: btnH });
      }
    } else {
      text("✨ ĐÃ NÂNG CẤP TỐI ĐA", cx + cardW / 2, cy + 110, {
        size: 12, weight: "bold", align: "center", color: highContrast ? "#00ff66" : "#81c784"
      });
    }
  });

  // Hàng tồn chuyển kho
  let stockText = "Không còn hàng tồn dư";
  if (snap?.stock) {
    const stockItems = [];
    for (const [k, v] of Object.entries(snap.stock)) {
      if (v > 0) stockItems.push(`${KIND_NAME[k] || k} ×${v}`);
    }
    if (stockItems.length > 0) stockText = stockItems.join(" · ");
  }
  text(`📦 Hàng tồn chuyển kho: ${stockText}`, mx + 20, my + mh - 66, {
    size: 12, color: "#cfd8dc"
  });

  // Nút đóng Shop sớm
  const dw = 280, dh = 40;
  const dx = (w - dw) / 2, dy = my + mh - 48;
  shopDoneBtnRect = { x: dx, y: dy, w: dw, h: dh };

  roundRect(ctx, dx, dy, dw, dh, 8);
  ctx.fillStyle = highContrast ? "#ffffff" : "#0288d1";
  ctx.fill();
  ctx.strokeStyle = highContrast ? "#ffffff" : "#29b6f6";
  ctx.lineWidth = 2;
  ctx.stroke();

  text("🚪 XONG & SANG NGÀY TIẾP (E / Space)", dx + dw / 2, dy + dh / 2, {
    size: 13, weight: "bold", align: "center", base: "middle",
    color: highContrast ? "#000000" : "#ffffff"
  });

  // HUD Dưới hướng dẫn
  ctx.fillStyle = highContrast ? "#000000" : "rgba(12, 20, 28, 0.9)";
  ctx.fillRect(0, h - 36, w, 36);
  text("Phím 1: Mua Oxy · Phím 2: Mua Máu · Phím 3: Mua Vợt · E / Space: Sang ngày mới · P: Tạm dừng", w / 2, h - 14, {
    size: 12, align: "center", color: "#9fb3c0"
  });
}

// ----- MÀN HÌNH KẾT THÚC & TOASTS & PAUSE -----
function overlay(w, h) {
  drawDangerVignette(w, h);
  updateAndDrawFloatingTexts();
  drawToasts(w, h);

  // MÀN HÌNH PAUSE (Tạm dừng trò chơi)
  if (snap && snap.state === "paused") {
    ctx.save();
    ctx.fillStyle = highContrast ? "rgba(0, 0, 0, 0.95)" : "rgba(6, 12, 18, 0.85)";
    ctx.fillRect(0, 0, w, h);

    const pw = 420, ph = 210;
    const px = (w - pw) / 2, py = (h - ph) / 2;

    roundRect(ctx, px, py, pw, ph, 12);
    ctx.fillStyle = highContrast ? "#000000" : "rgba(16, 26, 38, 0.98)";
    ctx.fill();
    ctx.strokeStyle = highContrast ? "#ffffff" : "rgba(255, 255, 255, 0.25)";
    ctx.lineWidth = highContrast ? 3 : 1.5;
    ctx.stroke();

    text("⏸️ TẠM DỪNG (PAUSED)", w / 2, py + 52, {
      size: 22, weight: "bold", align: "center", color: highContrast ? "#ffff00" : "#ffd54f"
    });
    text("Mọi đồng hồ và diễn biến trò chơi đang đứng yên", w / 2, py + 88, {
      size: 13, align: "center", color: "#9fb3c0"
    });

    const rw = 220, rh = 42;
    const rx = (w - rw) / 2, ry = py + 130;
    resumeBtnRect = { x: rx, y: ry, w: rw, h: rh };

    roundRect(ctx, rx, ry, rw, rh, 8);
    ctx.fillStyle = highContrast ? "#ffffff" : "#29b6f6";
    ctx.fill();
    ctx.strokeStyle = highContrast ? "#ffffff" : "#81d4fa";
    ctx.lineWidth = 1.5;
    ctx.stroke();

    text("▶️ TIẾP TỤC (Phím P / Esc)", w / 2, ry + rh / 2, {
      size: 13, weight: "bold", align: "center", base: "middle", color: "#000000"
    });

    ctx.restore();
    return;
  } else {
    resumeBtnRect = null;
  }

  // BANNER INTRO ĐẦU PHA (DayIntro & EveningIntro)
  if (snap && snap.phase_tick !== undefined && snap.phase_tick < 180 && !snap.finished) {
    const introAlpha = Math.min(1, Math.max(0, (180 - snap.phase_tick) / 60));
    ctx.save();
    ctx.globalAlpha = introAlpha;
    const introText = snap.phase === "gather"
      ? `☀️ BẮT ĐẦU NGÀY ${snap.day || 1} — THU HOẠCH NÔNG SẢN CÙNG ÚT SEN`
      : snap.phase === "quan"
      ? `🌙 BẮT ĐẦU MỞ QUÁN (NGÀY ${snap.day || 1}) — BẾP ĐÃ NỔI LỬA, ĐÓN KHÁCH!`
      : `🏪 TIỆM TẠP HÓA ĐÊM (NGÀY ${snap.day || 1}) — NÂNG CẤP TRANG BỊ`;

    const iw = 460, ih = 34;
    const ix = (w - iw) / 2, iy = 70;
    roundRect(ctx, ix, iy, iw, ih, 8);
    ctx.fillStyle = highContrast ? "#000000" : "rgba(12, 28, 48, 0.95)";
    ctx.fill();
    ctx.strokeStyle = highContrast ? "#ffffff" : "#29b6f6";
    ctx.lineWidth = 1.5;
    ctx.stroke();

    text(introText, w / 2, iy + ih / 2, {
      size: 13, weight: "bold", align: "center", base: "middle",
      color: highContrast ? "#ffff00" : "#e1f5fe", stroke: true
    });
    ctx.restore();
  }

      if (snap?.finished) {
        ctx.save();
        ctx.fillStyle = highContrast ? "rgba(0, 0, 0, 0.92)" : "rgba(6, 12, 18, 0.85)";
        ctx.fillRect(0, 0, w, h);

        const mw = Math.min(520, w - 40);
        const mh = 320;
        const mx = (w - mw) / 2, my = (h - mh) / 2;

    const mw = Math.min(560, w - 40);
    const mh = 330;
    const mx = (w - mw) / 2, my = (h - mh) / 2;

        const modeName = snap.mode === "gather" ? "BUỔI SÁNG (GATHER)" : "BUỔI TỐI (QUÁN)";
        text(modeName + " KẾT THÚC", w / 2, my + 42, {
          align: "center", size: 22, weight: "bold", color: highContrast ? "#ffff00" : "#ffd54f"
        });

    const isDayCampaign = snap.mode === "day" || snap.days_completed !== undefined;
    const modeName = isDayCampaign
      ? `CHIẾN DỊCH ${snap.days_completed || snap.day || 1} NGÀY`
      : snap.mode === "gather"
      ? "BUỔI SÁNG (GATHER)"
      : "BUỔI TỐI (QUÁN)";
    text(modeName + " KẾT THÚC", w / 2, my + 42, {
      align: "center", size: 22, weight: "bold", color: highContrast ? "#ffff00" : "#ffd54f"
    });

    let reasonText = "Hoàn thành phiên chơi";
    let reasonColor = "#81d4fa";
    if (snap.reason === "days_complete") {
      reasonText = "🎉 HOÀN THÀNH TOÀN BỘ 5 NGÀY — Quán ăn Chợ Nổi phát triển rực rỡ!";
      reasonColor = highContrast ? "#00ff66" : "#69f0ae";
    } else if (snap.reason === "docked") {
      reasonText = "⚓ CẬP BẾN AN TOÀN — Toàn bộ giỏ hàng đã được chốt vào kho!";
      reasonColor = highContrast ? "#00ff66" : "#69f0ae";
    } else if (snap.reason === "time") {
      reasonText = "⏱ HẾT GIỜ CA LÀM — Ca làm việc đã kết thúc đúng giờ quy định.";
      reasonColor = highContrast ? "#ffff00" : "#ffb74d";
    } else if (snap.reason === "fainted") {
      if (snap.faint_cause === "monster") {
        reasonText = "🐊 BỊ THỦY QUÁI TÁP KIỆT SỨC — Toàn bộ giỏ thu hoạch đã bị trôi mất!";
      } else {
        reasonText = "😵 KIỆT SỨC VÌ CẠN OXY — Toàn bộ giỏ thu hoạch đã bị trôi mất!";
      }
      reasonColor = highContrast ? "#ff3333" : "#ff5252";
    } else if (snap.reason) {
      reasonText = "Lý do: " + snap.reason;
    }
    text(reasonText, w / 2, my + 78, {
      align: "center", size: 13, weight: "bold", color: reasonColor
    });

    roundRect(ctx, mx + 30, my + 105, mw - 60, 120, 8);
    ctx.fillStyle = highContrast ? "#111111" : "rgba(255, 255, 255, 0.05)";
    ctx.fill();
    if (highContrast) {
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    if (isDayCampaign) {
      text(`📅 Số ngày đã qua: ${snap.days_completed ?? snap.day ?? 1} Ngày`, mx + 50, my + 138, { size: 14, color: "#ffffff" });
      text(`💰 Tổng tiền thu được: ${snap.earned ?? snap.money ?? 0}k`, mx + 50, my + 168, { size: 14, weight: "bold", color: highContrast ? "#ffff00" : "#ffd54f" });
      text(`⭐ Điểm Uy tín đạt được: ${(snap.reputation ?? 0).toFixed(1)} / 5.0 · 🏆 Tổng điểm: ${snap.score ?? 0}`, mx + 50, my + 198, { size: 14, weight: "bold", color: highContrast ? "#00ff66" : "#81d4fa" });
    } else if (snap.mode === "gather") {
      const holdCount = snap.hold ? snap.hold.length : 0;
      const holdCap = snap.hold_capacity || 12;
      text(`📦 Sản lượng thu hoạch: ${holdCount} / ${holdCap} món`, mx + 50, my + 140, { size: 14, color: "#ffffff" });
      text(`🫧 Lượng Máu còn lại: ${snap.player?.hp ?? 0} ♥`, mx + 50, my + 172, { size: 14, color: highContrast ? "#ff3333" : "#ff8a80" });
      text(`⏱ Thời gian tồn tại: ${fmtTime(snap.time_left_ticks)}`, mx + 50, my + 200, { size: 14, color: highContrast ? "#00ffff" : "#90caf9" });
    } else {
      text(`💰 Doanh thu: ${snap.money ?? 0}k`, mx + 50, my + 140, { size: 14, weight: "bold", color: highContrast ? "#ffff00" : "#ffd54f" });
      text(`⭐ Điểm Uy tín: ${(snap.reputation ?? 0).toFixed(1)} / 5.0`, mx + 50, my + 172, { size: 14, weight: "bold", color: highContrast ? "#00ffff" : "#81d4fa" });
      text(`🏆 Tổng điểm chung cuộc: ${snap.score ?? 0}`, mx + 50, my + 200, { size: 15, weight: "bold", color: highContrast ? "#00ff66" : "#69f0ae" });
    }

        roundRect(ctx, bx, by, bw, bh, 8);
        ctx.fillStyle = highContrast ? "#ffffff" : "#29b6f6";
        ctx.fill();
        ctx.strokeStyle = highContrast ? "#ffffff" : "#81d4fa";
        ctx.lineWidth = 2;
        ctx.stroke();

        text("🔄 CHƠI LẠI (Phím R)", w / 2, by + bh / 2, {
          align: "center", base: "middle", size: 14, weight: "bold", color: "#000000"
        });

        ctx.restore();
      } else {
        restartBtnRect = null;
      }
    }

    // ----- VÒNG LẶP CHÍNH -----
    function frame() {
      requestAnimationFrame(frame);
      const [w, h] = fit();

      ctx.save();
      if (shakeTicks > 0) {
        const ox = (Math.random() - 0.5) * shakeMag;
        const oy = (Math.random() - 0.5) * shakeMag;
        ctx.translate(ox, oy);
        shakeTicks--;
      }

      ctx.fillStyle = highContrast ? "#000000" : "#0c1218";
      ctx.fillRect(0, 0, w, h);

  ctx.fillStyle = highContrast ? "#000000" : "#0c1218";
  ctx.fillRect(0, 0, w, h);
  
  if (snap) {
    updateParticles();
    if (snap.phase === "shop") {
      drawShop(w, h);
    } else if (snap.phase === "quan" || snap.mode === "quan") {
      drawQuan(w, h);
    } else {
      drawGather(w, h);
    }
    eventLog(w, h);
    overlay(w, h);
  } else {
    text(offline ? "Không kết nối được máy chủ…" : "Đang tải dữ liệu trò chơi…", w / 2, h / 2, {
      align: "center", size: 18, color: "#9fb3c0"
    });
  }
  ctx.restore();
}
requestAnimationFrame(frame);
</script>
</body>
